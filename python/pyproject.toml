[project]
name = "ai-browser"
version = "0.1.4"
description = "Lightweight JavaScript-free browser for AI agents - token-efficient MCP server (stdio)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "truststore>=0.9",
]

[project.optional-dependencies]
# Tryb awaryjny dla stron wymagających JavaScriptu (Chromium)
js = ["playwright>=1.45"]

[project.scripts]
ai-browser = "ai_browser.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
