[project]
name = "ai-browser"
version = "0.1.5"
description = "Lightweight JavaScript-free browser for AI agents - token-efficient MCP server (stdio)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "truststore>=0.9",
    # Tryb JS: sama biblioteka w paczce, Chromium (~150 MB) pobiera użytkownik jedną komendą, gdy go potrzebuje
    "playwright>=1.45",
]

[project.optional-dependencies]
# Zgodność ze starymi komendami instalacji `ai-browser[js]`
js = []

[project.scripts]
ai-browser = "ai_browser.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
